openapi: '3.0.3'

info:
  title: CSE186 Assignment 8 Backend
  version: 0.1.0
  description: CSE186 Assignment 8 Backend

servers:
  - url: http://localhost:3010/v0

paths:
  /login:
    post:
      description: Login
      requestBody:
        description: Request Body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        200:
          description: Login Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'

  /home:
    get:
      security:
        - bearerAuth: []
      description: Home information for user
      responses:
        401:
          description: Unauthorized
        200:
          description: Fingers Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Finger'
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    UnexpectedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    Credentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    User:
      type: object
      required:
        - id
        - accessToken
      properties:
        id:
          type: string
          format: uuid
        accessToken:
          type: string

    Finger:
      type: object
      required:
        - id
        - patient_id
        - data
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        data:
          type: object
          required:
            - name
            - position
          properties:
            name:
              type: string
            position:
              type: array
              items:
                type: number
              minItems: 9
              maxItems: 9
